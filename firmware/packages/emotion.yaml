# Andy's emotional state.
#
# Emotion is a state, not a setter. It carries an intensity, a dwell time, and a
# precedence, and it decays back toward a baseline on its own. A source may only
# overwrite an emotion of equal or lower precedence, so being shaken cannot be
# painted over by a cheerful agent one tick later.
#
# Every emotion drives all three channels Andy has: the face on the LCD, the
# status ring, and a motion idiom. `emotion_profiles.h` is the single table that
# binds them, and `display.yaml` and `light.yaml` read from it rather than
# holding opinions of their own.
#
# The `Emotion` select is the addressable surface. Like the motion catalog it is
# a closed allowlist: the agent picks a name that exists or nothing happens. It
# can never supply a colour, a mask, or an angle.

esphome:
  includes:
    - emotion_profiles.h
  on_boot:
    - priority: -210
      then:
        - script.execute:
            id: set_emotion
            index: 24
            intensity: 40
            hold: 0
            priority: 0

