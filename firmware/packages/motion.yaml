interval:
  # A program may hold the rail, so it may not hold it indefinitely. This is the
  # backstop if a sequence is interrupted between poses and never ends itself.
  - interval: 1s
    then:
      - lambda: |-
          if (!id(motion_program_active) || id(motion_active)) {
            return;
          }
          if ((int32_t)(millis() - id(motion_program_until_ms)) >= 0) {
            ESP_LOGW("andy.motion_gate",
                     "Program outlived its deadline; ending and powering down");
            id(end_motion_program)->execute();
          }

  - interval: 25ms
    then:
      - lambda: |-
          if (!id(motion_active) || !id(motion_commanded)) {
            return;
          }

          const auto abs_int = [](int value) { return value < 0 ? -value : value; };
          auto stop_with_fault = [&](const char *reason) {
            id(scs9009_hub)->set_torque_pair(0);
            id(servo_power).turn_off();
            id(motion_active) = false;
            id(motion_commanded) = false;
            id(motion_active_sensor).publish_state(false);
            id(movement_fault_count)++;
            id(movement_faults).publish_state(id(movement_fault_count));
            id(motion_inhibited) = true;
            id(motion_inhibited_sensor).publish_state(true);
            id(motion_state).publish_state(std::string("fault: ") + reason);
            ESP_LOGE("andy.motion_gate", "Motion fault (count=%" PRIu32 "): %s",
                     id(movement_fault_count), reason);
          };

          const uint32_t now = millis();
          if ((int32_t)(now - id(motion_deadline_ms)) >= 0) {
            // Stop live sampling before the separate finalizer releases torque.
            id(motion_commanded) = false;
            id(finalize_fixed_motion).execute();
            return;
          }

          const bool yaw_axis = id(sample_yaw_next);
          id(sample_yaw_next) = !id(sample_yaw_next);
          const uint8_t servo_id = yaw_axis ? 1 : 2;
          int &feedback_misses = yaw_axis ? id(yaw_feedback_misses)
                                          : id(pitch_feedback_misses);
          if (id(scs9009_hub)->feedback(servo_id) <= 0) {
            feedback_misses++;
            if (yaw_axis) {
              id(yaw_feedback_miss_events)++;
              id(yaw_feedback_miss_total)++;
              id(yaw_feedback_misses_total_sensor).publish_state(
                  id(yaw_feedback_miss_total));
            } else {
              id(pitch_feedback_miss_events)++;
              id(pitch_feedback_miss_total)++;
              id(pitch_feedback_misses_total_sensor).publish_state(
                  id(pitch_feedback_miss_total));
            }
            if (feedback_misses >= 2) {
              stop_with_fault(yaw_axis ? "confirmed yaw feedback loss"
                                       : "confirmed pitch feedback loss");
            }
            return;
          }
          feedback_misses = 0;

          const int position = id(scs9009_hub)->cached_position();
          const int current = abs_int(id(scs9009_hub)->cached_current());
          const int load = abs_int(id(scs9009_hub)->cached_load());
          const int temperature = id(scs9009_hub)->cached_temperature();
          const int voltage = id(scs9009_hub)->cached_voltage();
          if (position < 0 || position > 1000 || temperature < 0 ||
              temperature >= 60 || voltage < 40 || voltage > 74) {
            stop_with_fault(yaw_axis ? "unsafe yaw telemetry" : "unsafe pitch telemetry");
            return;
          }

          if (yaw_axis) {
            id(yaw_seen_position) = position;
          } else {
            id(pitch_seen_position) = position;
          }

          // Arrived on both axes: finish now rather than sitting on the target
          // until the deadline. Every completion check still runs in the
          // finalizer, so this ends the move earlier, never less safely.
          if ((int32_t)(now - id(motion_earliest_finish_ms)) >= 0 &&
              id(yaw_seen_position) >= 0 && id(pitch_seen_position) >= 0 &&
              abs_int(id(motion_target_yaw_steps) - id(yaw_seen_position)) <= 8 &&
              abs_int(id(motion_target_pitch_steps) - id(pitch_seen_position)) <= 8) {
            id(motion_commanded) = false;
            id(finalize_fixed_motion).execute();
            return;
          }

          if (yaw_axis) {
            id(yaw_position).publish_state(position);
            id(yaw_load).publish_state(load);
            id(yaw_current).publish_state(current);
            id(yaw_temperature).publish_state(temperature);
            id(yaw_voltage).publish_state(voltage * 0.1f);
            if (current > id(yaw_peak_current)) id(yaw_peak_current) = current;
            if (load > id(yaw_peak_load)) id(yaw_peak_load) = load;
            if (temperature > id(yaw_peak_temperature)) id(yaw_peak_temperature) = temperature;
          } else {
            id(pitch_position).publish_state(position);
            id(pitch_load).publish_state(load);
            id(pitch_current).publish_state(current);
            id(pitch_temperature).publish_state(temperature);
            id(pitch_voltage).publish_state(voltage * 0.1f);
            if (current > id(pitch_peak_current)) id(pitch_peak_current) = current;
            if (load > id(pitch_peak_load)) id(pitch_peak_load) = load;
            if (temperature > id(pitch_peak_temperature)) id(pitch_peak_temperature) = temperature;
          }

          const int target = yaw_axis ? id(motion_target_yaw_steps)
                                      : id(motion_target_pitch_steps);
          const int target_delta = target - position;
          bool &last_valid = yaw_axis ? id(yaw_feedback_valid)
                                      : id(pitch_feedback_valid);
          int &last_position = yaw_axis ? id(yaw_last_position)
                                        : id(pitch_last_position);
          int &last_current = yaw_axis ? id(yaw_last_current)
                                       : id(pitch_last_current);
          int &last_load = yaw_axis ? id(yaw_last_load)
                                    : id(pitch_last_load);
          int &last_direction = yaw_axis ? id(yaw_last_direction)
                                         : id(pitch_last_direction);
          int &confirmations = yaw_axis ? id(yaw_stall_confirmations)
                                        : id(pitch_stall_confirmations);

          if (abs_int(target_delta) < 8) {
            last_valid = false;
            confirmations = 0;
            return;
          }

          const int direction = target_delta > 0 ? 1 : -1;
          if (last_valid && direction == last_direction) {
            const int position_delta = abs_int(position - last_position);
            const bool position_stuck = position_delta <= 1;
            const bool current_spike = current >= 350 || current - last_current >= 80;
            const bool load_spike = load >= 650 || load - last_load >= 150;
            if (position_stuck && (current_spike || load_spike)) {
              confirmations++;
            } else if (position_delta > 1) {
              confirmations = 0;
            }
          } else {
            confirmations = 0;
          }

          last_position = position;
          last_current = current;
          last_load = load;
          last_direction = direction;
          last_valid = true;

          if (confirmations >= 2) {
            stop_with_fault(yaw_axis ? "confirmed yaw stall" : "confirmed pitch stall");
          }

