binary_sensor:
  # The firmware can start a movement of its own, from an emotion idiom, while
  # the server is also free to run a named program. Both drive the same servos
  # and the same counters, so the server has to be able to see that the device
  # is already busy with its own choreography.
  - platform: template
    id: motion_program_sensor
    name: Motion program
    lambda: return id(motion_program_active);

  - platform: template
    id: motion_active_sensor
    name: Motion active
  - platform: template
    id: motion_inhibited_sensor
    name: Motion inhibited

text_sensor:
  - platform: template
    id: motion_state
    name: Motion state
    update_interval: never
