# Head touch and screen touch.
#
# The Si12T drives the three-zone capacitive panel on top of Andy's head. Its
# text sensors publish only on change, but each poll is still an I2C read, so
# the interval is set deliberately: 50 ms is fast enough to resolve a swipe
# across three zones, which is the shortest gesture worth recognising.
#
# The FT6336U behind the LCD glass has its interrupt wired to AW9523B P1_2, an
# expander pin rather than a real GPIO, so ESPHome's `interrupt_pin` cannot bind
# to it and the controller is polled instead.
#
# Both are standalone: petting Andy and muting him by touching the screen work
# with no server connected.

external_components:
  - source:
      type: git
      url: https://github.com/m5stack/esphome-yaml.git
      ref: 238ba9825e7874d5626709631dae6be92e861b17
      path: components
    components: [si12t]

esphome:
  on_boot:
    - priority: -200
      then:
        - binary_sensor.template.publish:
            id: head_touched
            state: false
        - binary_sensor.template.publish:
            id: screen_touched
            state: false
        - text_sensor.template.publish:
            id: head_gesture
            state: "none"

si12t:
  id: head_touch_hub
  i2c_id: bus_internal

globals:
  - id: head_touch_engaged
    type: bool
    restore_value: false
    initial_value: "false"
  - id: head_touch_start_position
    type: int
    restore_value: false
    initial_value: "0"

text_sensor:
  - platform: si12t
    id: head_touch_left
    name: Head touch left
    channel: CH_1
    update_interval: 50ms
    on_value:
      - script.execute: evaluate_head_touch
  - platform: si12t
    id: head_touch_centre
    name: Head touch centre
    channel: CH_2
    update_interval: 50ms
    on_value:
      - script.execute: evaluate_head_touch
  - platform: si12t
    id: head_touch_right
    name: Head touch right
    channel: CH_3
    update_interval: 50ms
    on_value:
      - script.execute: evaluate_head_touch

  - platform: template
    id: head_gesture
    name: Head gesture
    update_interval: never

binary_sensor:
  - platform: template
    id: head_touched
    name: Head touched
    device_class: occupancy

  - platform: template
    id: screen_touched
    name: Screen touched

script:
  # Weighted-position gesture recognition, following the algorithm in the
  # factory firmware's `hal_head_touch.cpp`: intensities across the three zones
  # give a position from -100 to 100, and a move of more than 40 while held is a
  # swipe rather than a press.
  - id: evaluate_head_touch
    mode: restart
    then:
      - lambda: |-
          auto level = [](const std::string &state) -> int {
            if (state == "High") return 3;
            if (state == "Medium") return 2;
            if (state == "Low") return 1;
            return 0;
          };
          const int left = level(id(head_touch_left).state);
          const int centre = level(id(head_touch_centre).state);
          const int right = level(id(head_touch_right).state);
          const int total = left + centre + right;
          const bool touched = total > 0;

          if (id(head_touched).state != touched) {
            id(head_touched).publish_state(touched);
          }
          if (!touched) {
            if (id(head_touch_engaged)) {
              id(head_touch_engaged) = false;
              id(head_gesture).publish_state("release");
            }
            return;
          }

          const int position = (left * -100 + right * 100) / total;
          if (!id(head_touch_engaged)) {
            id(head_touch_engaged) = true;
            id(head_touch_start_position) = position;
            id(head_gesture).publish_state("press");
            id(set_emotion)->execute(andy::E_HAPPY, 70, 8, andy::P_INTERACT);
            return;
          }

          const int travel = position - id(head_touch_start_position);
          if (travel >= 40) {
            id(head_touch_start_position) = position;
            id(head_gesture).publish_state("swipe right");
            id(set_emotion)->execute(andy::E_LOVING, 100, 12, andy::P_INTERACT);
          } else if (travel <= -40) {
            id(head_touch_start_position) = position;
            id(head_gesture).publish_state("swipe left");
            id(set_emotion)->execute(andy::E_LOVING, 100, 12, andy::P_INTERACT);
          }

touchscreen:
  - platform: ft63x6
    id: andy_touchscreen
    i2c_id: bus_internal
    display: andy_display
    update_interval: 100ms
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240
    on_touch:
      - binary_sensor.template.publish:
          id: screen_touched
          state: true
    on_release:
      - binary_sensor.template.publish:
          id: screen_touched
          state: false
      # A tap is the hardware mute: it works with no server connected.
      - if:
          condition:
            lambda: return id(continuous_listening_enabled);
          then:
            - button.press: conversation_sleep_button
          else:
            - button.press: conversation_follow_up_button
