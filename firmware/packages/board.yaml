# CoreS3 board, power delivery, connectivity, and shared device telemetry.
#
# Every entry point includes this package first. It owns the I2C bus, the
# AXP2101 rails, the two expander-driven power switches, and the diagnostic
# entities that are identical across builds.

substitutions:
  name: andy
  friendly_name: Andy

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0
  on_boot:
    # AW9523B P0_2 releases the amplifier reset at hardware setup priority.
    # AW88298 setup runs at data priority and requires at least 50 ms first.
    - priority: 700
      then:
        - lambda: delay(100);
    - priority: -100
      then:
        - switch.turn_off: servo_power
        - switch.turn_on: boost_enable
        - switch.turn_on: bus_output_enable
  on_shutdown:
    - priority: 700
      then:
        - switch.turn_off: servo_power

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "n"
      CONFIG_ESP_CONSOLE_USB_CDC: "n"
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "n"
      CONFIG_ESP_CONSOLE_UART_CUSTOM: "n"
      CONFIG_ESP_CONSOLE_NONE: "y"
      CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG: "n"
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: "y"

psram:
  mode: quad
  speed: 80MHz

logger:
  # Every line here crosses the WireGuard tunnel, which is the tightest
  # resource in the system, and anything above this level is compiled out
  # rather than merely filtered. Nothing in this project logs below INFO --
  # every counter the release canary counts is an `ESP_LOGI` -- so the debug
  # traffic was entirely vendor components describing their own internals.
  # `CONFIG` is the level to return to when the boot-time component inventory
  # is wanted for diagnosis.
  level: INFO
  # Logs are delivered only through the encrypted native API over Wi-Fi.
  baud_rate: 0
  # This inert selector prevents ESPHome from linking USB Serial/JTAG helpers.
  hardware_uart: UART0

external_components:
  - source:
      type: git
      url: https://github.com/m5stack/esphome-yaml.git
      ref: 238ba9825e7874d5626709631dae6be92e861b17
      path: components
    components: [axp2101, aw88298, aw9523b, m5ioe1]

i2c:
  - id: bus_internal
    sda: GPIO12
    scl: GPIO11
    # The PY32L020 controller is configured for 100 kHz by the factory firmware.
    frequency: 100kHz
    scan: false

axp2101:
  id: axp2101_pmu
  i2c_id: bus_internal

# These rails and voltages match the CoreS3 vendor board configuration.
output:
  - platform: axp2101
    id: core_aldo1
    channel: ALDO1
    voltage: 1800
  - platform: axp2101
    id: core_aldo2
    channel: ALDO2
    voltage: 3300
  - platform: axp2101
    id: core_aldo3
    channel: ALDO3
    voltage: 3300
  - platform: axp2101
    id: core_aldo4
    channel: ALDO4
    voltage: 3300
  - platform: axp2101
    id: core_bldo1
    channel: BLDO1
    voltage: 2800
  - platform: axp2101
    id: core_bldo2
    channel: BLDO2
    voltage: 1500
  - platform: axp2101
    id: core_dcdc1
    channel: DCDC1
    voltage: 3300
  - platform: axp2101
    id: core_dcdc3
    channel: DCDC3
    voltage: 3300
  - platform: axp2101
    id: core_dcdc4
    channel: DCDC4
    voltage: 1800
  - platform: axp2101
    id: core_dcdc5
    channel: DCDC5
    voltage: 3300

m5ioe1:
  id: m5ioe1_hub
  i2c_id: bus_internal
  reset: true

aw9523b:
  id: aw9523b_hub
  i2c_id: bus_internal
  p0_drive_mode: PUSH_PULL
  # The shared interrupt line for every AW9523B input. With it configured the
  # component keeps its loop disabled until the line falls, so the input
  # sensors below cost no steady-state I2C traffic.
  interrupt_pin: GPIO21

switch:
  # PY32 IO1 / exposed pin 0 controls the StackChan servo VM_EN rail.
  - platform: gpio
    id: servo_power
    internal: true
    pin:
      m5ioe1_id: m5ioe1_hub
      number: 0
    restore_mode: ALWAYS_OFF

  # AW9523B P0_2 releases the AW88298 reset when high.
  - platform: gpio
    id: amplifier_reset
    internal: true
    pin:
      aw9523b_id: aw9523b_hub
      number: 2
    restore_mode: ALWAYS_ON

  # AW9523B P1_7 is BOOST_EN, the CoreS3 5 V boost converter. It supplies the
  # BUS rail that the robot body's 12-LED bar draws from, so it is held on. The
  # AW88298 and the 1 W speaker do not depend on it.
  - platform: gpio
    id: boost_enable
    name: Boost rail
    entity_category: config
    pin:
      aw9523b_id: aw9523b_hub
      number: 15
    restore_mode: ALWAYS_ON

  # AW9523B P0_1 is BUS_OUT_EN. BOOST_EN must be on before it takes effect.
  - platform: gpio
    id: bus_output_enable
    name: Bus output rail
    entity_category: config
    pin:
      aw9523b_id: aw9523b_hub
      number: 1
    restore_mode: ALWAYS_ON

debug:
  update_interval: 10s

# Per-component loop attribution over the encrypted API. `debug` reports only a
# whole-loop peak, which cannot say which component produced it, and the 25 ms
# motion supervisor makes that attribution a safety question rather than a
# curiosity.
runtime_stats:
  log_interval: 30s

sensor:
  - platform: debug
    free:
      name: Heap free
    loop_time:
      name: Main loop time
  - platform: uptime
    name: Uptime
    update_interval: 10s
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 10s

binary_sensor:
  - platform: status
    name: API status

  # AW9523B inputs. These share one cached port read and are serviced only when
  # the GPIO21 interrupt line falls.
  - platform: gpio
    name: SD card present
    entity_category: diagnostic
    pin:
      aw9523b_id: aw9523b_hub
      number: 4
      inverted: true
      mode:
        input: true

  - platform: gpio
    name: Microphone codec interrupt
    entity_category: diagnostic
    pin:
      aw9523b_id: aw9523b_hub
      number: 3
      mode:
        input: true

  - platform: gpio
    name: Touch controller interrupt
    entity_category: diagnostic
    pin:
      aw9523b_id: aw9523b_hub
      number: 10
      mode:
        input: true

  - platform: gpio
    name: Amplifier interrupt
    entity_category: diagnostic
    pin:
      aw9523b_id: aw9523b_hub
      number: 11
      mode:
        input: true

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
