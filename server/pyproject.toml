[project]
name = "andy-server"
version = "0.5.0"
description = "Deterministic voice-agent server for the M5Stack Andy robot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioesphomeapi==45.12.0",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "onnxruntime>=1.20,<2",
    "pydantic-ai-slim[mcp,openai]>=1.0,<2",
    "uvicorn[standard]>=0.35,<1",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    # The MCP client library ships client support only, which is all Andy
    # needs at runtime: he calls connectors, he is not one. The tests do have
    # to stand a real MCP server up in front of him, and that is this.
    "fastmcp-slim[client,server]>=3.4,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
